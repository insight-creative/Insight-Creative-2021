name: Vicki Woschnick
first_name: Vicki
job_title: Senior Copywriter
bio: >-
  Meet Vicki, Insight’s word nerd.


  As a senior copywriter, Vicki turns complex concepts into clear messaging that informs, educates, and meaningfully connects people with products and services. From technical guides and web copy to video scripts and emails, no format is off-limits when it comes to telling a brand’s story.
communication_with_substance_block: 
  enabled: true
  body: As an experienced content strategist and storyteller, Vicki delivers communication with substance by making even the most technical topics clear, engaging and purposeful.
history_block: 
  heading: How she got here
  body: >-
    Marketing was the furthest thing from Vicki’s mind as she prepped for law school. But while working as a proofreader at a local ad agency, an opportunity to write changed her path entirely. Two and a half decades later, Vicki is still at it and loving every minute.
    

    Part academic and part creative, Vicki thrives on content challenges in sectors ranging from heavy industrial and manufacturing to financial, healthcare, SaaS, and consumer goods, among others. Outside of client work, she regularly volunteers her writing for military veteran organizations, animal welfare efforts and other causes close to her heart.
quote:
  body: Growing brands alongside a team of smart, trusted people who value straight talk and clear purpose over marketing noise.
fun_fact: 
  enabled: true
  body: Vicki isn't fully ambidextrous, just oddly specific. Her right hand handles the pen and keyboard, while her left hand pretty much takes over the rest of daily life. To make it weirder, her sister has the inverse genetic glitch—writing leftie and doing everything else right-handed.
marketing_tip:
  body: Ditch the jargon. Plain language isn't a sign of simple thinking. It means you value helping your customers over using buzzwords that sound fancy but communicate little.
