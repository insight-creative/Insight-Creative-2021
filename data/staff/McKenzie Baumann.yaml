name: McKenzie Baumann
first_name: McKenzie
job_title: Social Media Coordinator
bio: >-
  Meet McKenzie, Insight’s resident K-pop expert and stargazer.


  As a social media coordinator, McKenzie helps bring brands to life across social platforms through content scheduling, graphic design, video editing and creative content development. She enjoys finding new ways to connect businesses with their audiences while making sure each piece of content fits the platform where it will perform best.
communication_with_substance_block: 
  enabled: true
  body: McKenzie embodies communication with substance by making social media easier to understand. Every platform has its own audience, strengths and content style, and she helps break down those differences so businesses know where and how to show up.
history_block: 
  heading: How she got here
  body: >-
    McKenzie graduated from the University of Wisconsin–Stout in spring 2024 with a degree in Digital Marketing Technology.
    
    
    After graduation, she completed a social media internship with an entertainment company while working in retail and searching for her first full-time marketing role. In February 2025, she joined Hockers Home Services as a community engagement specialist, where she helped coordinate local events and support the company’s social media efforts.
    
    
    Her interest in social media continued to grow, eventually leading her to look for a role where she could focus more closely on content and digital marketing. 
quote:
  body: Being able to learn and grow alongside a great group of people who are experts in their fields.
fun_fact: 
  enabled: true
  body: McKenzie has maintained a Duolingo streak of more than 1,100 days. Along the way, she has studied Korean, French and German and, most recently, started learning how to play chess through the app.
marketing_tip:
  body: Social media can be incredibly beneficial if you take the time to understand how to use it and which platforms make sense for your business.
