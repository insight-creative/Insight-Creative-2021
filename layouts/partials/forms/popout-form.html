<div class="popout">
    <div class="backdrop"></div>
    <div class="cc-button">
        <div class="popup-container">
            <div class="popup-tab effect-mega-pulse-base effect-mega-pulse-in">
                <div class="popup-tab-quote-container">
                    <p>Connect with Insight Creative</p>
                    <svg width="12" height="13" viewBox="0 0 12 13" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M5.96591 12.1364L4.64773 10.8295L8.10795 7.36932H0V5.44886H8.10795L4.64773 1.99432L5.96591 0.681818L11.6932 6.40909L5.96591 12.1364Z"
                            fill="#ffffff"></path>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <div class="cc-popout bg-black-2">
        <div class="popout-container">
            <div class="close">
                <button data-cc="close-button-desktop" class="sc-fqkvVR iwbIBR">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="#000" d="m1 1 12 12M13 1 1 13"></path>
                    </svg>
                </button>
            </div>
            <div type="contact-info" class="sc-jlZhew fEVwD">
                <div class="contact-form">
                    <h4 class="no-margin">Contact Insight Creative</h4>
                    <div class="contact-form__wrapper">
                        <form method="post" name="contact" data-netlify="true" netlify-honeypot="bot-field"
                            action="/contact/thank-you/">
                            <div hidden>
                                <label for="bot-field">
                                    Don’t fill this out if you're human:
                                    <input name="bot-field" id="bot-field" />
                                </label>
                            </div>
                            <div class="visually-hidden">
                                <label for="subject">New form submission from the insightcreative.com contact form</label>
                                <input aria-label="subject" name="subject"
                                    value="New form submission from the insightcreative.com contact form" />
                            </div>
                            <div class="contact-form__form-group">
                                <label for="name">Name*</label>
                                <input id="name" name="name" type="text" class="contact-form__form-control" required>
                            </div>
                            <div class="contact-form__form-group">
                                <label for="email">Email*</label>
                                <input id="email" name="_replyto" type="email" class="contact-form__form-control" required>
                            </div>
                            <div class="contact-form__form-group">
                                <label for="phone">Phone</label>
                                <input id="phone" name="phone" type="tel" class="contact-form__form-control">
                            </div>
                            <div class="contact-form__form-group">
                                <label for="company-name">Company name</label>
                                <input id="company-name" name="company-name" type="name" class="contact-form__form-control">
                            </div>
                            <div class="contact-form__form-group">
                                <label for="help">What do you need help with?*</label>
                                <select id="help" name="help" type="select" class="contact-form__form-control" required>
                                    <option value="Web Design and Development">Please Select</option>
                                    <option value="Copywriting / PR / Social Media">Copywriting / PR / Social Media</option>
                                    <option value="Media Buying">Media Buying</option>
                                    <option value="Website Design / Website Development">Website Design / Website Development</option>
                                    <option value="Branding / Digital / Print Design">Branding / Digital / Print Design</option>
                                    <option value="Digital Marketing">Digital Marketing</option>
                                    <option value="Photography / Videography / Drone">Photography / Videography / Drone</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="contact-form__form-group">
                                <label for="referral">Where Did You Hear About Us?*</label>
                                <select class="contact-form__form-control" name="Where Did You Hear About Us?" id="referral" required>
                                    <option value="Please Select">Please Select</option>
                                    <option value="Internet Search">Internet Search</option>
                                    <option value="ChatGPT/AI">ChatGPT/AI</option>
                                    <option value="Digital Ad">Digital Ad</option>
                                    <option value="Insight Creative Team Member">Insight Creative Team Member</option>
                                    <option value="Insight Creative Email/Social">Insight Creative Email/Social</option>
                                    <option value="Insight Creative Blog">Insight Creative Blog</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="contact-form__form-group">
                                <label for="message">Message*</label>
                                <textarea id="message" name="message" class="contact-form__form-control" rows="4" required></textarea>
                            </div>
                            <button target="_blank" type="submit" class="contact-form__btn btn btn-primary">Send
                                Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
